name: Build ESP Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        id: cache-theos
        with:
          path: theos
          key: ${{ runner.os }}-theos-${{ hashFiles('.gitmodules') }}

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos
          theos-sdks: https://github.com/theos/sdks

      - name: Build tweak
        run: |
          export THEOS=./theos
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ESPTweak
          path: packages/*.deb
